name: CI

on:
  push:
    branches: ['1.0']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4.*', '7.4.*', '8.1.*']
        dependencies: ['highest']
        exclude:
          # Symfony 8 requires PHP >= 8.4
          - php: '8.2'
            symfony: '8.1.*'
          - php: '8.3'
            symfony: '8.1.*'
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: 'lowest'
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan & PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=github --memory-limit=512M

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff
